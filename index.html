<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>18m Budget 4-A-Side FPL Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { -webkit-tap-highlight-color: transparent; user-select: none; }
        input, select { user-select: auto; }
        body { font-family: 'Inter', sans-serif; background-color: #070a10; color: #f0f6fc; }
        .fpl-pitch-stripes {
            background: repeating-linear-gradient(
                0deg,
                #00874e,
                #00874e 32px,
                #006e3f 32px,
                #006e3f 64px
            );
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-0 sm:p-4 selection:bg-purple-500 selection:text-white antialiased">

    <div class="w-full max-w-md sm:max-w-2xl mx-auto min-h-screen flex flex-col relative bg-slate-950 shadow-2xl sm:rounded-3xl sm:border sm:border-slate-800 overflow-hidden">
        
        <!-- Header -->
        <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-md">
            <span class="text-[#00ff87] font-black text-base tracking-wide flex items-center gap-1.5">
                <i class="fas fa-futbol"></i>
                <span>18m FPL 4-A-Side</span>
            </span>
            <div id="cloudStatus" class="text-[10px] font-black px-2.5 py-1 rounded-full border bg-amber-950 text-amber-400 border-amber-500/40 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                <span id="cloudStatusText">連接雲端中...</span>
            </div>
        </header>

        <!-- Notification Toast -->
        <div id="toast" class="hidden fixed top-14 left-1/2 -translate-x-1/2 z-50 bg-amber-400 text-slate-950 px-4 py-2.5 rounded-2xl shadow-2xl font-black text-xs border border-amber-300 text-center max-w-[90%]"></div>

        <!-- Navigation Tabs -->
        <nav class="bg-slate-900/90 border-b border-slate-800 p-2 grid grid-cols-3 gap-1">
            <button id="btnTabSquad" onclick="switchTab('squad')" class="py-2 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 bg-[#00ff87] text-slate-950 shadow">
                <i class="fas fa-shirt"></i> 我的陣容
            </button>
            <button id="btnTabLeaderboard" onclick="switchTab('leaderboard')" class="py-2 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 bg-slate-950 text-slate-400">
                <i class="fas fa-trophy"></i> 聯賽榜
            </button>
            <button id="btnTabCatalog" onclick="switchTab('catalog')" class="py-2 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 bg-slate-950 text-slate-400">
                <i class="fas fa-users"></i> 球員名單
            </button>
        </nav>

        <!-- TAB 1: SQUAD BUILDER -->
        <section id="tabSquad" class="p-3.5 space-y-4 pb-12 flex-1 overflow-y-auto">
            <!-- Team Config Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-3 shadow-lg">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 block mb-1">隊伍名稱 (Team Name / Firestore Doc ID)</label>
                    <input type="text" id="teamNameInput" placeholder="輸入你的球隊名字..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-black text-white focus:outline-none focus:border-amber-400">
                </div>

                <div class="flex items-center justify-between pt-1">
                    <div class="flex items-center space-x-1">
                        <span class="text-[10px] font-bold text-slate-400 mr-1">陣型:</span>
                        <button onclick="setFormation('1-2-1')" id="btnForm121" class="px-2.5 py-1 rounded-lg text-xs font-black transition bg-amber-400 text-slate-950">1-2-1</button>
                        <button onclick="setFormation('2-1-1')" id="btnForm211" class="px-2.5 py-1 rounded-lg text-xs font-black transition bg-slate-950 text-slate-400 border border-slate-800">2-1-1</button>
                        <button onclick="setFormation('1-1-2')" id="btnForm112" class="px-2.5 py-1 rounded-lg text-xs font-black transition bg-slate-950 text-slate-400 border border-slate-800">1-1-2</button>
                    </div>

                    <div class="text-right">
                        <div class="text-[9px] font-extrabold text-slate-400">剩餘預算</div>
                        <div id="budgetDisplay" class="text-xs font-black text-[#00ff87]">£18.0m / £18.0m</div>
                    </div>
                </div>
            </div>

            <!-- Visual Pitch -->
            <div class="relative rounded-2xl overflow-hidden shadow-2xl border-2 border-emerald-600/50 fpl-pitch-stripes min-h-[360px] flex flex-col justify-around items-center p-4">
                <div class="absolute inset-x-8 top-0 h-16 border-b-2 border-x-2 border-white/20 rounded-b-xl pointer-events-none"></div>
                <div class="absolute inset-x-0 top-1/2 -translate-y-1/2 h-0.5 bg-white/20 pointer-events-none"></div>
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 border-2 border-white/20 rounded-full pointer-events-none"></div>

                <div id="pitchSlotsContainer" class="w-full flex flex-col justify-around h-full min-h-[320px] z-10 space-y-4">
                    <!-- Dynamic Pitch Slots Generated via JS -->
                </div>
            </div>

            <!-- Active Chips Section -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2 shadow-lg">
                <span class="text-[10px] font-black text-amber-400 uppercase tracking-wider block">選擇特權卡 (Active Chip)</span>
                <div class="grid grid-cols-3 gap-2">
                    <button id="chipBtnNone" onclick="setChip('none')" class="p-2 rounded-xl text-xs font-black border transition bg-slate-800 border-amber-400 text-white">不使用</button>
                    <button id="chipBtnDesmond" onclick="setChip('desmond')" class="p-2 rounded-xl text-xs font-black border transition bg-slate-950 border-slate-800 text-slate-400">Desmond (+3/-3)</button>
                    <button id="chipBtnBenjie" onclick="setChip('benjie')" class="p-2 rounded-xl text-xs font-black border transition bg-slate-950 border-slate-800 text-slate-400">Benjie CS (+6)</button>
                </div>
            </div>

            <!-- Submit Button -->
            <button onclick="handleTeamSubmit()" class="w-full bg-[#00ff87] hover:bg-[#00e077] text-slate-950 font-black py-3.5 rounded-2xl text-xs transition active:scale-95 shadow-xl flex items-center justify-center gap-2">
                <i class="fas fa-paper-plane"></i> 提交 / 更新陣容 (Submit to Firestore)
            </button>
        </section>

        <!-- TAB 2: LEADERBOARD -->
        <section id="tabLeaderboard" class="p-3.5 space-y-3 pb-12 flex-1 overflow-y-auto hidden">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fas fa-trophy"></i> 聯賽排行榜 (Firestore 'team')
                    </span>
                    <span id="teamCountBadge" class="text-[10px] text-slate-400 font-extrabold">0 隊參賽</span>
                </div>
                <div id="leaderboardList" class="space-y-2">
                    <div class="text-center py-8 text-xs text-slate-500">正在加載聯賽數據...</div>
                </div>
            </div>
        </section>

        <!-- TAB 3: PLAYER CATALOG -->
        <section id="tabCatalog" class="p-3.5 space-y-3 pb-12 flex-1 overflow-y-auto hidden">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg">
                <span class="text-xs font-black text-slate-200 uppercase tracking-wider block">可選球員名單</span>
                <div id="catalogList" class="space-y-2 max-h-[500px] overflow-y-auto"></div>
            </div>
        </section>

        <!-- Player Selection Modal -->
        <div id="pickerModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col justify-end sm:justify-center items-center p-0 sm:p-4">
            <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-4 space-y-3 max-h-[85vh] flex flex-col shadow-2xl">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <span id="pickerTitle" class="font-black text-sm text-white">選擇球員</span>
                    <button onclick="closePickerModal()" class="text-slate-400"><i class="fas fa-xmark text-lg"></i></button>
                </div>
                <input type="text" id="pickerSearch" oninput="renderPickerList()" placeholder="搜尋球員名字..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold text-white focus:outline-none focus:border-amber-400">
                <div id="pickerListContainer" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK (v11.6.1 ES Modules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Provided Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBHCEBQ5UeCvKpu9BmTdC-mC3HaEUGiYhw",
            authDomain: "pcms-75e2a.firebaseapp.com",
            databaseURL: "https://pcms-75e2a-default-rtdb.firebaseio.com",
            projectId: "pcms-75e2a",
            storageBucket: "pcms-75e2a.firebasestorage.app",
            messagingSenderId: "648765702228",
            appId: "1:648765702228:web:9b1d637a520e4e2c2b2dc1",
            measurementId: "G-ZGYQCCFXQ6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Player Catalog Database
        const PLAYERS = [
            { id: 'p1', name: '維維', price: 3.0, position: 'DEF' },
            { id: 'p2', name: '咖哩', price: 6.0, position: 'MID' },
            { id: 'p3', name: '世朗', price: 5.0, position: 'DEF' },
            { id: 'p4', name: 'Adam', price: 3.0, position: 'DEF' },
            { id: 'p5', name: '浩揚', price: 8.0, position: 'ATT' },
            { id: 'p6', name: 'Lolo', price: 3.5, position: 'DEF' },
            { id: 'p7', name: 'Ian', price: 4.5, position: 'DEF' },
            { id: 'p8', name: 'Peewa', price: 5.5, position: 'ATT' },
            { id: 'p9', name: '重恩', price: 3.5, position: 'DEF' },
            { id: 'p10', name: '以式', price: 5.0, position: 'MID' },
            { id: 'p11', name: '信', price: 2.0, position: 'DEF' },
            { id: 'p12', name: '甘', price: 3.0, position: 'MID' },
            { id: 'p13', name: 'Hayto', price: 6.5, position: 'MID' },
            { id: 'p14', name: '天浠', price: 5.5, position: 'ATT' },
            { id: 'p15', name: 'Gavin', price: 2.0, position: 'DEF' },
            { id: 'p16', name: 'Summer', price: 2.5, position: 'ATT' },
            { id: 'p17', name: '柏朗', price: 4.0, position: 'MID' },
            { id: 'p18', name: 'Ocean', price: 4.0, position: 'DEF' },
            { id: 'p19', name: '史', price: 4.0, position: 'DEF' }
        ];

        const FORMATIONS = {
            '1-2-1': [
                { id: 0, pos: 'ATT', label: '前鋒 (ATT)' },
                { id: 1, pos: 'MID', label: '中場 (MID 1)' },
                { id: 2, pos: 'MID', label: '中場 (MID 2)' },
                { id: 3, pos: 'DEF', label: '後衛 (DEF)' }
            ],
            '2-1-1': [
                { id: 0, pos: 'ATT', label: '前鋒 (ATT)' },
                { id: 1, pos: 'MID', label: '中場 (MID)' },
                { id: 2, pos: 'DEF', label: '後衛 (DEF 1)' },
                { id: 3, pos: 'DEF', label: '後衛 (DEF 2)' }
            ],
            '1-1-2': [
                { id: 0, pos: 'ATT', label: '前鋒 (ATT 1)' },
                { id: 1, pos: 'ATT', label: '前鋒 (ATT 2)' },
                { id: 2, pos: 'MID', label: '中場 (MID)' },
                { id: 3, pos: 'DEF', label: '後衛 (DEF)' }
            ]
        };

        // App State
        let currentFormation = '1-2-1';
        let slotSelections = {}; // { slotIndex: playerId }
        let captainId = null;
        let activeChip = 'none'; // 'none' | 'desmond' | 'benjie'
        let activePickerSlotIndex = null;

        // Initialize Firebase Anonymous Authentication
        signInAnonymously(auth)
            .then(() => {
                const cloudStatusEl = document.getElementById('cloudStatus');
                cloudStatusEl.className = "text-[10px] font-black px-2.5 py-1 rounded-full border bg-emerald-950 text-emerald-400 border-emerald-500/40 flex items-center gap-1";
                document.getElementById('cloudStatusText').innerText = "雲端已連線";
            })
            .catch(err => {
                console.error("Firebase Auth error:", err);
                showToast("⚠️ Firebase 連線失敗");
            });

        // Realtime Listener for Firestore 'team' Collection
        onSnapshot(collection(db, 'team'), (snapshot) => {
            const teams = [];
            snapshot.forEach(doc => {
                teams.push({ id: doc.id, ...doc.data() });
            });
            teams.sort((a, b) => (b.points || 0) - (a.points || 0));
            renderLeaderboard(teams);
        }, (err) => {
            console.error("Firestore reader error:", err);
        });

        // Functions Exported to Window
        window.switchTab = function(tabName) {
            document.getElementById('tabSquad').classList.add('hidden');
            document.getElementById('tabLeaderboard').classList.add('hidden');
            document.getElementById('tabCatalog').classList.add('hidden');

            document.getElementById('btnTabSquad').className = "py-2 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 bg-slate-950 text-slate-400";
            document.getElementById('btnTabLeaderboard').className = "py-2 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 bg-slate-950 text-slate-400";
            document.getElementById('btnTabCatalog').className = "py-2 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 bg-slate-950 text-slate-400";

            if(tabName === 'squad') {
                document.getElementById('tabSquad').classList.remove('hidden');
                document.getElementById('btnTabSquad').className = "py-2 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 bg-[#00ff87] text-slate-950 shadow";
            } else if(tabName === 'leaderboard') {
                document.getElementById('tabLeaderboard').classList.remove('hidden');
                document.getElementById('btnTabLeaderboard').className = "py-2 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 bg-[#00ff87] text-slate-950 shadow";
            } else if(tabName === 'catalog') {
                document.getElementById('tabCatalog').classList.remove('hidden');
                document.getElementById('btnTabCatalog').className = "py-2 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 bg-[#00ff87] text-slate-950 shadow";
                renderCatalog();
            }
        };

        window.setFormation = function(fmt) {
            currentFormation = fmt;
            slotSelections = {};
            captainId = null;
            
            ['121', '211', '112'].forEach(f => {
                const btn = document.getElementById(`btnForm${f}`);
                if (`${f.slice(0,1)}-${f.slice(1,2)}-${f.slice(2,3)}` === fmt) {
                    btn.className = "px-2.5 py-1 rounded-lg text-xs font-black transition bg-amber-400 text-slate-950";
                } else {
                    btn.className = "px-2.5 py-1 rounded-lg text-xs font-black transition bg-slate-950 text-slate-400 border border-slate-800";
                }
            });

            renderPitch();
            updateBudgetDisplay();
        };

        window.setChip = function(chip) {
            activeChip = chip;
            document.getElementById('chipBtnNone').className = chip === 'none' ? "p-2 rounded-xl text-xs font-black border transition bg-slate-800 border-amber-400 text-white" : "p-2 rounded-xl text-xs font-black border transition bg-slate-950 border-slate-800 text-slate-400";
            document.getElementById('chipBtnDesmond').className = chip === 'desmond' ? "p-2 rounded-xl text-xs font-black border transition bg-purple-950 border-purple-400 text-purple-300" : "p-2 rounded-xl text-xs font-black border transition bg-slate-950 border-slate-800 text-slate-400";
            document.getElementById('chipBtnBenjie').className = chip === 'benjie' ? "p-2 rounded-xl text-xs font-black border transition bg-indigo-950 border-indigo-400 text-indigo-300" : "p-2 rounded-xl text-xs font-black border transition bg-slate-950 border-slate-800 text-slate-400";
        };

        window.openPickerModal = function(slotIndex) {
            activePickerSlotIndex = slotIndex;
            const slotConfig = FORMATIONS[currentFormation][slotIndex];
            document.getElementById('pickerTitle').innerText = `選擇球員 (${slotConfig.label})`;
            document.getElementById('pickerSearch').value = '';
            renderPickerList();
            document.getElementById('pickerModal').classList.remove('hidden');
        };

        window.closePickerModal = function() {
            document.getElementById('pickerModal').classList.add('hidden');
            activePickerSlotIndex = null;
        };

        window.selectPlayerForSlot = function(playerId) {
            if (activePickerSlotIndex === null) return;
            
            // Remove player if already chosen in another slot
            Object.keys(slotSelections).forEach(key => {
                if(slotSelections[key] === playerId) delete slotSelections[key];
            });

            slotSelections[activePickerSlotIndex] = playerId;
            if(!captainId) captainId = playerId;

            closePickerModal();
            renderPitch();
            updateBudgetDisplay();
        };

        window.setCaptain = function(playerId, e) {
            if(e) e.stopPropagation();
            captainId = playerId;
            renderPitch();
        };

        // Render Pitch Cards
        function renderPitch() {
            const container = document.getElementById('pitchSlotsContainer');
            container.innerHTML = '';

            const slots = FORMATIONS[currentFormation];
            
            // Group by position row for presentation
            const attSlots = slots.filter(s => s.pos === 'ATT');
            const midSlots = slots.filter(s => s.pos === 'MID');
            const defSlots = slots.filter(s => s.pos === 'DEF');

            [attSlots, midSlots, defSlots].forEach(rowSlots => {
                if (rowSlots.length === 0) return;
                const rowDiv = document.createElement('div');
                rowDiv.className = "flex justify-around items-center w-full px-2";

                rowSlots.forEach(slot => {
                    const selectedPid = slotSelections[slot.id];
                    const player = PLAYERS.find(p => p.id === selectedPid);
                    const isCap = player && captainId === player.id;

                    const card = document.createElement('div');
                    card.className = "w-20 sm:w-24 flex flex-col items-center relative active:scale-95 transition-transform duration-150 cursor-pointer";
                    card.onclick = () => openPickerModal(slot.id);

                    let captainBadge = player ? `
                        <button onclick="setCaptain('${player.id}', event)" class="absolute -top-3 -right-1 font-black text-xs w-7 h-7 rounded-full flex items-center justify-center border-2 border-slate-950 z-20 shadow-lg ${isCap ? 'bg-amber-400 text-slate-950 ring-2 ring-amber-300 animate-pulse' : 'bg-slate-800 text-slate-300'}">
                            C
                        </button>
                    ` : '';

                    let jerseySvg = player ? `
                        <svg class="w-8 h-8 sm:w-10 sm:h-10 drop-shadow-md" viewBox="0 0 24 24" fill="${player.position === 'DEF' ? '#38003c' : player.position === 'MID' ? '#002f6c' : '#bd0026'}">
                            <path d="M12 4.2L8.5 2 2 5.5l2.5 4.5L7 8.5V21h10V8.5l2.5 1.5L22 5.5 15.5 2 12 4.2z" stroke="#ffffff" stroke-width="1.2" />
                        </svg>
                    ` : '<i class="fas fa-plus text-white/60 text-lg sm:text-xl"></i>';

                    card.innerHTML = `
                        ${captainBadge}
                        <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-t-xl flex flex-col items-center justify-center border shadow-lg ${player ? 'bg-slate-950/90 border-white/40' : 'bg-slate-900/50 border-dashed border-white/40'}">
                            ${jerseySvg}
                        </div>
                        <div class="w-full font-black text-[10px] sm:text-xs py-1 px-1 text-center truncate shadow-md ${player ? 'bg-white text-slate-950' : 'bg-slate-900/90 text-slate-300'}">
                            ${player ? player.name : slot.label}
                        </div>
                        <div class="w-full bg-[#38003c] text-[#00ff87] font-black text-[10px] sm:text-xs py-0.5 text-center rounded-b-lg shadow-md border-t border-purple-900/50">
                            ${player ? `£${player.price.toFixed(1)}m` : '選擇球員'}
                        </div>
                    `;
                    rowDiv.appendChild(card);
                });

                container.appendChild(rowDiv);
            });
        }

        window.renderPickerList = function() {
            if (activePickerSlotIndex === null) return;
            const slotConfig = FORMATIONS[currentFormation][activePickerSlotIndex];
            const query = document.getElementById('pickerSearch').value.toLowerCase();
            const container = document.getElementById('pickerListContainer');
            container.innerHTML = '';

            PLAYERS
                .filter(p => p.position === slotConfig.pos)
                .filter(p => p.name.toLowerCase().includes(query))
                .forEach(p => {
                    const isPicked = Object.values(slotSelections).includes(p.id);
                    const item = document.createElement('div');
                    item.className = `p-3 rounded-xl border flex items-center justify-between cursor-pointer transition active:scale-98 ${isPicked ? 'bg-amber-950/40 border-amber-500/50' : 'bg-slate-950 border-slate-800 hover:border-slate-600'}`;
                    item.onclick = () => selectPlayerForSlot(p.id);

                    item.innerHTML = `
                        <div>
                            <div class="font-extrabold text-xs text-white">${p.name}</div>
                            <div class="text-[10px] text-slate-400">身價: £${p.price.toFixed(1)}m</div>
                        </div>
                        ${isPicked ? '<span class="text-[10px] font-black bg-amber-400 text-slate-950 px-2 py-0.5 rounded">已選擇</span>' : '<button class="text-[10px] font-black bg-slate-800 text-slate-200 px-3 py-1 rounded-lg">選擇</button>'}
                    `;
                    container.appendChild(item);
                });
        };

        function calculateBudget() {
            return Object.values(slotSelections).reduce((sum, pid) => {
                const player = PLAYERS.find(p => p.id === pid);
                return sum + (player ? player.price : 0);
            }, 0);
        }

        function updateBudgetDisplay() {
            const spent = calculateBudget();
            const remaining = 18.0 - spent;
            const el = document.getElementById('budgetDisplay');
            el.innerText = `£${remaining.toFixed(1)}m / £18.0m`;
            el.className = remaining < 0 ? "text-xs font-black text-red-400" : "text-xs font-black text-[#00ff87]";
        }

        // Handle Firestore Document Creation/Modification
        window.handleTeamSubmit = async function() {
            const teamName = document.getElementById('teamNameInput').value.trim();
            if (!teamName) {
                showToast("⚠️ 請輸入隊伍名稱！");
                return;
            }

            if (Object.keys(slotSelections).length < 4) {
                showToast("⚠️ 請選滿 4 位球員！");
                return;
            }

            if (calculateBudget() > 18.0) {
                showToast("⚠️ 總金額超出 £18.0m 預算限制！");
                return;
            }

            // Group players into ATT, MID, DEF
            const groupedPlayers = { DEF: [], MID: [], ATT: [] };
            Object.values(slotSelections).forEach(pid => {
                const p = PLAYERS.find(pl => pl.id === pid);
                if (p && groupedPlayers[p.position]) {
                    groupedPlayers[p.position].push({
                        id: p.id,
                        name: p.name,
                        price: p.price,
                        isCaptain: p.id === captainId
                    });
                }
            });

            // Prepare Firestore Payload
            const payload = {
                teamName: teamName,
                formation: currentFormation,
                players: groupedPlayers,
                desmond: activeChip === 'desmond' ? 'using' : 'unused',
                benjie: activeChip === 'benjie' ? 'using' : 'unused',
                points: 0,
                updatedAt: Date.now()
            };

            try {
                // Document ID set directly as Team Name
                const docRef = doc(db, 'team', teamName);
                await setDoc(docRef, payload, { merge: true });
                showToast(`🎉 隊伍「${teamName}」成功儲存至 Firestore！`);
            } catch (err) {
                console.error("Firestore Save Error:", err);
                showToast("❌ 儲存失敗: " + err.message);
            }
        };

        // Render Real-Time Leaderboard Tab from Firestore
        function renderLeaderboard(teams) {
            const container = document.getElementById('leaderboardList');
            document.getElementById('teamCountBadge').innerText = `${teams.length} 隊參賽`;
            container.innerHTML = '';

            if (teams.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-xs text-slate-500">暫無數據 (Firestore Collection \'team\' 為空)</div>';
                return;
            }

            teams.forEach((t, idx) => {
                const card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800/80 rounded-xl p-3 space-y-2 shadow";

                // Format players display list
                let playerTags = [];
                if (t.players) {
                    ['DEF', 'MID', 'ATT'].forEach(pos => {
                        (t.players[pos] || []).forEach(p => {
                            playerTags.push(`<span class="text-[9px] bg-slate-900 border border-slate-800 text-slate-300 px-1.5 py-0.5 rounded">${p.name}${p.isCaptain ? ' (C)' : ''}</span>`);
                        });
                    });
                }

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2.5">
                            <span class="w-6 h-6 rounded-lg font-black text-xs flex items-center justify-center ${idx === 0 ? 'bg-amber-400 text-slate-950' : idx === 1 ? 'bg-slate-300 text-slate-950' : idx === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-400'}">
                                ${idx + 1}
                            </span>
                            <div>
                                <div class="font-black text-xs text-white">${t.teamName || t.id}</div>
                                <div class="text-[9px] text-slate-400">陣型: ${t.formation || 'N/A'} • Desmond: ${t.desmond || 'unused'} • Benjie: ${t.benjie || 'unused'}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs font-black text-[#00ff87]">${t.points || 0} 分</div>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-1 pt-1 border-t border-slate-900">
                        ${playerTags.join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderCatalog() {
            const container = document.getElementById('catalogList');
            container.innerHTML = '';
            PLAYERS.forEach(p => {
                const item = document.createElement('div');
                item.className = "bg-slate-950 border border-slate-800/80 rounded-xl p-2.5 flex items-center justify-between";
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-6 h-6 rounded-md flex items-center justify-center font-black text-[10px] ${p.position === 'DEF' ? 'bg-purple-950 text-purple-300 border border-purple-500/40' : p.position === 'MID' ? 'bg-blue-950 text-blue-300 border border-blue-500/40' : 'bg-red-950 text-red-300 border border-red-500/40'}">
                            ${p.position}
                        </span>
                        <span class="font-extrabold text-xs text-white">${p.name}</span>
                    </div>
                    <span class="font-black text-xs text-[#00ff87]">£${p.price.toFixed(1)}m</span>
                `;
                container.appendChild(item);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        // Initial Render
        renderPitch();
    </script>
</body>
</html>
