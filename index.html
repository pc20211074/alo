                                        .filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()))
                                        .map(p => {
                                            const isAlreadyPicked = Object.values(slotSelections).includes(p.id);
                                            return (
                                                <div
                                                    key={p.id}
                                                    onClick={() => handleSlotSelectPlayer(p)}
                                                    className={`p-3 rounded-xl border flex items-center justify-between cursor-pointer transition active:scale-98 ${isAlreadyPicked ? 'bg-amber-950/40 border-amber-500/50' : 'bg-slate-950 border-slate-800/80 hover:border-slate-600'}`}
                                                >
                                                    <div>
                                                        <div className="font-extrabold text-xs text-white">{p.name}</div>
                                                        <div className="text-[10px] text-slate-400">身價: £{p.price.toFixed(1)}m</div>
                                                    </div>
                                                    {isAlreadyPicked ? (
                                                        <span className="text-[10px] font-black bg-amber-400 text-slate-950 px-2 py-0.5 rounded">已選擇</span>
                                                    ) : (
                                                        <button className="text-[10px] font-black bg-slate-800 hover:bg-amber-400 hover:text-slate-950 text-slate-200 px-3 py-1 rounded-lg transition">選擇</button>
                                                    )}
                                                </div>
                                            );
                                        })}
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedTeamDetail && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in duration-200">
                            <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-4 space-y-3 shadow-2xl">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                                    <div>
                                        <div className="font-black text-sm text-white">{selectedTeamDetail.teamName}</div>
                                        <div className="text-[10px] text-slate-400">陣型: {selectedTeamDetail.formation}</div>
                                    </div>
                                    <button onClick={() => setSelectedTeamDetail(null)} className="text-slate-400">
                                        <i className="fas fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <div className="space-y-2">
                                    {Object.values(selectedTeamDetail.slotSelections || {}).map(pid => {
                                        const player = playerList.find(p => p.id === pid);
                                        if (!player) return null;
                                        const isCap = selectedTeamDetail.captainId === pid;
                                        const pStat = (leagueState.playerStats || {})[pid] || {};
                                        const pts = calculatePlayerPoints(player, pStat) * (isCap ? 2 : 1);
                                        return (
                                            <div key={pid} className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between text-xs">
                                                <div className="flex items-center space-x-2">
                                                    <span className={`w-5 h-5 rounded font-black text-[9px] flex items-center justify-center ${player.position === 'DEF' ? 'bg-purple-950 text-purple-300' : player.position === 'MID' ? 'bg-blue-950 text-blue-300' : 'bg-red-950 text-red-300'}`}>
                                                        {player.position}
                                                    </span>
                                                    <span className="font-bold text-white">{player.name} {isCap && '(C)'}</span>
                                                </div>
                                                <span className="font-black text-[#00ff87]">{pts} 分</span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <button
                                    onClick={() => setSelectedTeamDetail(null)}
                                    className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-black py-2.5 rounded-xl text-xs"
                                >
                                    關閉
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function UnifiedApp() {
            const [currentMode, setCurrentMode] = React.useState('player');
            const [playerActiveTab, setPlayerActiveTab] = React.useState('squad');
            const [adminActiveTab, setAdminActiveTab] = React.useState('settings');
            const [notification, setNotification] = React.useState(null);
            const [modalConfig, setModalConfig] = React.useState(null);

            const [isAdminAuthenticated, setIsAdminAuthenticated] = React.useState(false);
            const [isPasswordModalOpen, setIsPasswordModalOpen] = React.useState(false);
            const [passwordInput, setPasswordInput] = React.useState('');
            const [isCloudConnected, setIsCloudConnected] = React.useState(false);

            const [leagueState, setLeagueState] = React.useState(() => {
                const saved = localStorage.getItem('fpl_league_state');
                return saved ? JSON.parse(saved) : {
                    teams: [],
                    playerStats: {},
                    announcement: '',
                    playerCatalog: DEFAULT_PLAYERS,
                    deadline: null,
                    currentGameweek: 1,
                    teamHistory: {}
                };
            });

            const broadcastChannelRef = React.useRef(null);

            React.useEffect(() => {
                window.handleRemoteLeagueState = (remoteState) => {
                    if (remoteState) {
                        setLeagueState(remoteState);
                        localStorage.setItem('fpl_league_state', JSON.stringify(remoteState));
                    }
                };

                window.onCloudStatusChange = (status) => {
                    setIsCloudConnected(status);
                };

                try {
                    broadcastChannelRef.current = new BroadcastChannel('fpl_sync_channel');
                    broadcastChannelRef.current.onmessage = (event) => {
                        if (event.data) {
                            setLeagueState(event.data);
                        }
                    };
                } catch(e) {
                    console.log('BroadcastChannel not supported');
                }

                return () => broadcastChannelRef.current?.close();
            }, []);

            const handleSwitchToAdmin = () => {
                if (isAdminAuthenticated) {
                    setCurrentMode('admin');
                } else {
                    setPasswordInput('');
                    setIsPasswordModalOpen(true);
                }
            };

            const handlePasswordSubmit = (e) => {
                if (e) e.preventDefault();
                if (passwordInput === '20211074') {
                    setIsAdminAuthenticated(true);
                    setCurrentMode('admin');
                    setIsPasswordModalOpen(false);
                    setPasswordInput('');
                    showNotification('🔓 成功進入後台管理系統！');
                } else {
                    showNotification('❌ 密碼錯誤，請重新輸入！');
                    setPasswordInput('');
                }
            };

            const updateLeagueState = (partialState) => {
                setLeagueState(prev => {
                    const newState = { ...prev, ...partialState, _lastUpdated: Date.now() };
                    localStorage.setItem('fpl_league_state', JSON.stringify(newState));
                    
                    broadcastChannelRef.current?.postMessage(newState);
                    
                    if (window.saveLeagueStateToCloud) {
                        window.saveLeagueStateToCloud(newState);
                    }
                    return newState;
                });
            };

            const showNotification = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 3500);
            };

            const requestConfirmation = (config) => {
                setModalConfig(config);
            };

            return (
                <div className="w-full min-h-screen flex flex-col bg-slate-950 text-slate-100 relative">
                    <div className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-md">
                        <div className="flex items-center space-x-2">
                            <span className="text-[#00ff87] font-black text-base tracking-wide flex items-center gap-1.5">
                                <i className="fas fa-futbol text-[#00ff87]"></i>
                                <span>18m FPL 4-A-Side</span>
                            </span>
                        </div>

                        <div className="flex items-center space-x-2">
                            <div className="bg-slate-950 p-1 rounded-xl border border-slate-800 flex space-x-1">
                                <button
                                    onClick={() => setCurrentMode('player')}
                                    className={`px-2.5 py-1 rounded-lg text-[10px] font-black transition flex items-center gap-1 ${currentMode === 'player' ? 'bg-[#00ff87] text-slate-950 shadow' : 'text-slate-400'}`}
                                >
                                    <i className="fas fa-gamepad"></i> 玩家
                                </button>
                                <button
                                    onClick={handleSwitchToAdmin}
                                    className={`px-2.5 py-1 rounded-lg text-[10px] font-black transition flex items-center gap-1 ${currentMode === 'admin' ? 'bg-amber-400 text-slate-950 shadow' : 'text-slate-400'}`}
                                >
                                    <i className={`fas ${isAdminAuthenticated ? 'fa-crown' : 'fa-lock'}`}></i> 後台
                                </button>
                            </div>

                            <span className={`text-[9px] font-black px-2 py-1 rounded-full border hidden sm:flex items-center gap-1 ${isCloudConnected ? 'bg-emerald-950 text-emerald-400 border-emerald-500/40' : 'bg-amber-950 text-amber-400 border-amber-500/40'}`}>
                                <span className={`w-1.5 h-1.5 rounded-full ${isCloudConnected ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                                {isCloudConnected ? '☁️ 雲端同步' : '本地模式'}
                            </span>
                        </div>
                    </div>

                    {notification && (
                        <div className="fixed top-14 left-1/2 -translate-x-1/2 z-50 bg-amber-400 text-slate-950 px-4 py-2.5 rounded-2xl shadow-2xl font-black text-xs border border-amber-300 animate-in fade-in zoom-in duration-200 text-center max-w-[90%]">
                            {notification}
                        </div>
                    )}

                    {currentMode === 'player' ? (
                        <div className="bg-slate-900/90 border-b border-slate-800 p-2 grid grid-cols-3 gap-1">
                            <button
                                onClick={() => setPlayerActiveTab('squad')}
                                className={`py-2 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 ${playerActiveTab === 'squad' ? 'bg-[#00ff87] text-slate-950 shadow' : 'bg-slate-950 text-slate-400'}`}
                            >
                                <i className="fas fa-shirt"></i> 我的陣容
                            </button>
                            <button
                                onClick={() => setPlayerActiveTab('leaderboard')}
                                className={`py-2 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 ${playerActiveTab === 'leaderboard' ? 'bg-[#00ff87] text-slate-950 shadow' : 'bg-slate-950 text-slate-400'}`}
                            >
                                <i className="fas fa-trophy"></i> 聯賽榜
                            </button>
                            <button
                                onClick={() => setPlayerActiveTab('stats')}
                                className={`py-2 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 ${playerActiveTab === 'stats' ? 'bg-[#00ff87] text-slate-950 shadow' : 'bg-slate-950 text-slate-400'}`}
                            >
                                <i className="fas fa-chart-bar"></i> 球員數據
                            </button>
                        </div>
                    ) : (
                        <div className="bg-slate-900/90 border-b border-slate-800 p-2 grid grid-cols-4 gap-1">
                            <button
                                onClick={() => setAdminActiveTab('settings')}
                                className={`py-2 rounded-xl text-xs font-black transition flex flex-col items-center justify-center ${adminActiveTab === 'settings' ? 'bg-amber-400 text-slate-950 shadow' : 'bg-slate-950 text-slate-400'}`}
                            >
                                <i className="fas fa-sliders mb-0.5"></i>
                                <span className="text-[10px]">設定/截止</span>
                            </button>
                            <button
                                onClick={() => setAdminActiveTab('catalog')}
                                className={`py-2 rounded-xl text-xs font-black transition flex flex-col items-center justify-center ${adminActiveTab === 'catalog' ? 'bg-amber-400 text-slate-950 shadow' : 'bg-slate-950 text-slate-400'}`}
                            >
                                <i className="fas fa-users mb-0.5"></i>
                                <span className="text-[10px]">球員目錄</span>
                            </button>
                            <button
                                onClick={() => setAdminActiveTab('stats')}
                                className={`py-2 rounded-xl text-xs font-black transition flex flex-col items-center justify-center ${adminActiveTab === 'stats' ? 'bg-amber-400 text-slate-950 shadow' : 'bg-slate-950 text-slate-400'}`}
                            >
                                <i className="fas fa-clipboard-check mb-0.5"></i>
                                <span className="text-[10px]">比賽錄入</span>
                            </button>
                            <button
                                onClick={() => setAdminActiveTab('teams')}
                                className={`py-2 rounded-xl text-xs font-black transition flex flex-col items-center justify-center ${adminActiveTab === 'teams' ? 'bg-amber-400 text-slate-950 shadow' : 'bg-slate-950 text-slate-400'}`}
                            >
                                <i className="fas fa-trophy mb-0.5"></i>
                                <span className="text-[10px]">隊伍/特權</span>
                            </button>
                        </div>
                    )}

                    <div className="flex-1 overflow-y-auto pb-12">
                        {currentMode === 'player' ? (
                            <PlayerApplication
                                leagueState={leagueState}
                                updateLeagueState={updateLeagueState}
                                showNotification={showNotification}
                                activeTab={playerActiveTab}
                                setActiveTab={setPlayerActiveTab}
                            />
                        ) : (
                            <React.Fragment>
                                {adminActiveTab === 'settings' && (
                                    <LeagueSettingsTab
                                        leagueState={leagueState}
                                        updateLeagueState={updateLeagueState}
                                        showNotification={showNotification}
                                        requestConfirmation={requestConfirmation}
                                    />
                                )}
                                {adminActiveTab === 'catalog' && (
                                    <PlayerCatalogTab
                                        leagueState={leagueState}
                                        updateLeagueState={updateLeagueState}
                                        showNotification={showNotification}
                                    />
                                )}
                                {adminActiveTab === 'stats' && (
                                    <StatsEntryTab
                                        leagueState={leagueState}
                                        updateLeagueState={updateLeagueState}
                                        showNotification={showNotification}
                                    />
                                )}
                                {adminActiveTab === 'teams' && (
                                    <TeamsResolutionTab
                                        leagueState={leagueState}
                                        updateLeagueState={updateLeagueState}
                                        showNotification={showNotification}
                                        requestConfirmation={requestConfirmation}
                                    />
                                )}
                            </React.Fragment>
                        )}
                    </div>

                    {isPasswordModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in fade-in duration-200">
                            <form onSubmit={handlePasswordSubmit} className="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center space-x-2 text-amber-400">
                                        <i className="fas fa-lock text-lg"></i>
                                        <h3 className="font-black text-sm text-white">進入後台管理員驗證</h3>
                                    </div>
                                    <button type="button" onClick={() => setIsPasswordModalOpen(false)} className="text-slate-400 hover:text-white">
                                        <i className="fas fa-xmark"></i>
                                    </button>
                                </div>
                                <p className="text-xs text-slate-400 font-medium">請輸入管理員密碼以開啟聯賽設定、錄入數據及結算功能：</p>
                                <input
                                    type="password"
                                    placeholder="輸入密碼"
                                    value={passwordInput}
                                    onChange={(e) => setPasswordInput(e.target.value)}
                                    autoFocus
                                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm font-bold text-white focus:outline-none focus:border-amber-400"
                                />
                                <div className="flex space-x-2 pt-1">
                                    <button
                                        type="button"
                                        onClick={() => setIsPasswordModalOpen(false)}
                                        className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition active:scale-95"
                                    >
                                        取消
                                    </button>
                                    <button
                                        type="submit"
                                        className="flex-1 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black py-2.5 rounded-xl text-xs transition active:scale-95"
                                    >
                                        解鎖進入
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    <ConfirmationModal config={modalConfig} onClose={() => setModalConfig(null)} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<UnifiedApp />);
    </script>

    <!-- Firebase SDK Implementation -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
        import { getDatabase, ref, set, onValue, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBHCEBQ5UeCvKpu9BmTdC-mC3HaEUGiYhw",
            authDomain: "pcms-75e2a.firebaseapp.com",
            databaseURL: "https://pcms-75e2a-default-rtdb.firebaseio.com",
            projectId: "pcms-75e2a",
            storageBucket: "pcms-75e2a.firebasestorage.app",
            messagingSenderId: "648765702228",
            appId: "1:648765702228:web:9b1d637a520e4e2c2b2dc1",
            measurementId: "G-ZGYQCCFXQ6"
        };

        // Initialize Firebase Services
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        // Firebase Realtime Database References
        const leagueStateRef = ref(db, 'fpl_league/state');
        const activeSessionsRef = ref(db, 'fpl_league/sessions/' + Date.now());

        // Handle Site/Tab Close & Connection Status Tracking
        onDisconnect(activeSessionsRef).set({
            status: 'offline',
            lastClosedAt: serverTimestamp()
        });

        set(activeSessionsRef, {
            status: 'online',
            connectedAt: serverTimestamp()
        });

        // Real-Time Database Listener: Updates UI across all clients when database changes
        onValue(leagueStateRef, (snapshot) => {
            if (snapshot.exists()) {
                const remoteData = snapshot.val();
                if (remoteData && window.handleRemoteLeagueState) {
                    window.handleRemoteLeagueState(remoteData);
                }
            }
            if (window.onCloudStatusChange) {
                window.onCloudStatusChange(true);
            }
        }, (err) => {
            console.error('Firebase Database Read Error:', err);
            if (window.onCloudStatusChange) {
                window.onCloudStatusChange(false);
            }
        });

        // Write Function: Modify database on button click or state updates
        window.saveLeagueStateToCloud = async function(newState) {
            try {
                await set(leagueStateRef, {
                    ...newState,
                    _lastSavedTimestamp: Date.now()
                });
            } catch (err) {
                console.error('Error saving state to Firebase Realtime Database:', err);
            }
        };

        // Window Close/Unload Handler: Record last exit timestamp
        window.addEventListener('beforeunload', () => {
            const savedState = localStorage.getItem('fpl_league_state');
            if (savedState) {
                try {
                    const stateObj = JSON.parse(savedState);
                    set(ref(db, 'fpl_league/last_closed'), {
                        timestamp: Date.now(),
                        currentGameweek: stateObj.currentGameweek || 1
                    });
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
